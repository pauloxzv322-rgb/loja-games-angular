<div class="card shadow-sm">
  <div class="card-header bg-dark text-white">
    <h4 class="mb-0">{{ idProduto ? 'Editar Produto' : 'Cadastrar Novo Produto' }}</h4>
  </div>

  <div class="card-body">
    <div *ngIf="mensagemErro" class="alert alert-danger">
      {{ mensagemErro }}
    </div>

    <form (ngSubmit)="salvar()">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Produto / Jogo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          class="form-control"
          [(ngModel)]="produto.nome"
          required
          placeholder="Ex: PlayStation 5 Slim"
        />
      </div>

      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea
          id="descricao"
          name="descricao"
          class="form-control"
          rows="3"
          [(ngModel)]="produto.descricao"
          required
          placeholder="Ex: Console 1TB com controle sem fio DualSense"
        ></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="preco" class="form-label">Preço (R$)</label>
          <input
            type="number"
            id="preco"
            name="preco"
            step="0.01"
            class="form-control"
            [(ngModel)]="produto.preco"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label for="estoque" class="form-label">Quantidade em Estoque</label>
          <input
            type="number"
            id="estoque"
            name="estoque"
            class="form-control"
            [(ngModel)]="produto.estoque"
            required
          />
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          {{ idProduto ? 'Salvar Alterações' : 'Cadastrar Produto' }}
        </button>
        <a routerLink="/produtos" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
